[project]
name = "trading-terminal"
version = "0.1.0"
description = "Self-hosted trading terminal (phase 1: auth, Kraken market data, paper simulator)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=42",
  "httpx>=0.27",
  "websockets>=13",
  "typer>=0.12",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore:Dialect sqlite\\+aiosqlite does \\*not\\* support Decimal"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tt*"]
